<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif">
  <rect x="1" y="1" width="758" height="298" rx="18" fill="#F5F6FF" stroke="#DDE0FB" stroke-width="2"/>
  <rect x="24" y="22" width="712" height="254" rx="10" fill="#fff" stroke="#D1D5DB"/>
  <!-- address bar -->
  <rect x="24" y="22" width="712" height="40" rx="10" fill="#F1F3F4"/>
  <rect x="44" y="30" width="420" height="24" rx="12" fill="#fff"/>
  <text x="60" y="47" font-size="13" fill="#202124">chrome://extensions</text>
  <!-- header -->
  <text x="48" y="96" font-size="20" fill="#202124">Extensions</text>
  <text x="560" y="96" font-size="13" fill="#202124">Developer mode</text>
  <rect x="672" y="83" width="36" height="18" rx="9" fill="#1A73E8"/><circle cx="699" cy="92" r="7" fill="#fff"/>
  <rect x="548" y="74" width="172" height="36" rx="9" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="538" cy="70" r="12" fill="#5865F2"/><text x="538" y="75" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <!-- toolbar -->
  <rect x="48" y="124" width="112" height="30" rx="5" fill="#fff" stroke="#1A73E8"/>
  <text x="104" y="144" font-size="13" font-weight="600" fill="#1A73E8" text-anchor="middle">Load unpacked</text>
  <rect x="40" y="116" width="128" height="46" rx="9" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="40" cy="116" r="12" fill="#5865F2"/><text x="40" y="121" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="180" y="144" font-size="13" fill="#5F6368">Pack extension</text>
  <!-- folder picker -->
  <rect x="300" y="132" width="404" height="128" rx="10" fill="#F8F9FA" stroke="#D1D5DB"/>
  <text x="320" y="156" font-size="12" fill="#5F6368">ytm-discord-presence</text>
  <g font-size="13">
    <text x="336" y="182" fill="#5F6368">📄 config.json</text>
    <rect x="326" y="190" width="200" height="24" rx="5" fill="#D2E3FC"/>
    <text x="336" y="207" fill="#174EA6" font-weight="700">📁 extension</text>
    <text x="336" y="234" fill="#5F6368">📄 host.log</text>
  </g>
  <rect x="604" y="222" width="84" height="28" rx="5" fill="#1A73E8"/>
  <text x="646" y="241" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Select</text>
  <circle cx="540" cy="202" r="12" fill="#5865F2"/><text x="540" y="207" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
</svg>
