name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...

      # The installer is the part Windows users run themselves: register, check, remove.
      # Every location goes to a temp folder and a throwaway registry key.
      - name: Installer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          YTM_DISCORD_DATA_DIR: ${{ runner.temp }}\ytmd-data
          YTM_DISCORD_REGISTRY_KEY: Software\ytmd-ci
        run: ./scripts/smoke-windows.ps1

  extension:
    name: Extension type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
