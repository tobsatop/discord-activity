<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Original icon (not the YouTube Music logo): red disc with a white pair of beamed notes.
       Regenerate the PNGs after editing: npm run icons (needs ImageMagick). -->
